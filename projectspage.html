<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page des projets</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="container">

            <h1>Projets</h1>

            <div class="container-barre">
                <div class="barre-projects"></div>
            </div>

            <div class="container-project">
                <h2 class="project-title">TeddyTask</h2>

            </div>

            <div class="container-gif-teddetask">
                <img src="./assets/teddytask-gif.gif" alt="image du projet TeddyTask" class="project-image">
            </div>
            


            <div class="container-stack">
                <h3 class="title-langages">Langages</h3>
                <div class="container-langages">
                                    
                    <div class="container-icon">
                        <img src="./assets/icone/html.png" class="langage-icon" alt="Icône HTML">
                        <p class="langage-description">HTML</p>
                    </div>

                    <div class="container-icon">
                        <img src="./assets/icone/css.png" class="langage-icon" alt="Icône CSS">
                        <p class="langage-description">CSS</p>
                    </div>

                    <div class="container-icon">
                        <img src="./assets/icone/javascript.png" class="langage-icon" alt="Icône JavaScript">
                        <p class="langage-description">JavaScript</p>
                    </div>

                    <div class="container-icon">
                        <img src="./assets/icone/figma.png" class="more-icon" alt="Icône Figma">
                        <p class="more-description">Figma</p>
                    </div>

                    <div class="container-icon">
                        <img src="./assets/icone/canva.png" class="more-icon" alt="Icône Canva">
                        <p class="more-description">Canva</p>
                    </div>

                    <div class="container-icon">
                        <img src="./assets/icone/git.png" class="more-icon" alt="Icône Git">
                        <p class="more-description">Git</p>
                    </div>
                </div>

                <div class="project-description">
                    <h3 class="title-description">Description des tâches réalisées</h3>
                    <p class="description-text">

                    </p>
                </div>

    </div>
</body>
</html>
